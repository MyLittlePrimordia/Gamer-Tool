name: Build GamerTool Standalone EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore GamerTool/GamerTool.csproj

      - name: Publish Single File
        run: >
          dotnet publish GamerTool/GamerTool.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamerTool-Standalone
          path: ./publish/GamerTool.exe
